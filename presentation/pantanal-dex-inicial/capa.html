<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .slide-container { width: 1280px; min-height: 720px; background: #E8F0E6; color: #0A3B24; display: grid; grid-template-columns: 46% 54%; align-items: stretch; font-family: monospace; }
    .copy { padding: 88px 40px 20px 72px; display: flex; flex-direction: column; justify-content: space-between; border-right: 8px solid #0A3B24; }
    .eyebrow { font-size: 20px; letter-spacing: 5px; text-transform: uppercase; font-weight: 700; }
    h1 { font-family: Georgia, serif; font-size: 76px; line-height: 0.95; font-weight: 900; letter-spacing: -3px; margin: 0; }
    .subtitle { font-size: 25px; line-height: 1.35; max-width: 430px; color: #2C3531; }
    .meta { font-size: 15px; line-height: 1.6; color: #1E56A0; }
    .visual { padding: 18px 36px 18px 34px; display: flex; align-items: center; justify-content: center; background: #0A3B24; }
    .visual img { width: 620px; height: 560px; object-fit: contain; border: 8px solid #E8F0E6; display: block; }
  </style>
</head>
<body>
  <div class="slide-container">
    <section class="copy">
      <div class="eyebrow">Guia de campo</div>
      <div>
        <h1>Pantanal<br>Dex</h1>
        <p class="subtitle">Um guia de campo para conhecer, registrar e proteger a vida do Pantanal.</p>
      </div>
      <div class="meta">Apresentação inicial do conceito<br>Agosto de 2026</div>
    </section>
    <section class="visual">
      <img src="/home/ubuntu/upload/search_images/U1R3zy3aNbWU.jpg" alt="Paisagem alagada do Pantanal" />
    </section>
  </div>
</body>
</html>
