<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Flip.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #E8F0E6;
            color: #0A3B24;
            font-family: monospace;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 8px solid #0A3B24;
        }
        #pd-main-visual {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.3;
        }
        #pd-main-visual img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #pd-logo-container {
            position: relative;
            z-index: 2;
            margin-bottom: 20px;
        }
        .logo-box {
            background: #0A3B24;
            color: #E8F0E6;
            padding: 20px 40px;
            font-family: Georgia, serif;
            font-size: 84px;
            font-weight: 900;
            border: 8px solid #0A3B24;
            letter-spacing: -2px;
        }
        #pd-title-container {
            position: relative;
            z-index: 2;
            text-align: center;
        }
        h1 {
            font-family: Georgia, serif;
            font-size: 32px;
            text-transform: uppercase;
            letter-spacing: 8px;
            color: #1E56A0;
            margin-top: 20px;
        }
        .meta {
            position: absolute;
            bottom: 40px;
            font-size: 14px;
            letter-spacing: 2px;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="slide-container" id="pd-scene">
        <div id="pd-main-visual">
            <img src="/home/ubuntu/upload/search_images/U1R3zy3aNbWU.jpg" alt="Pantanal Background">
        </div>
        
        <div id="pd-logo-container">
            <div class="logo-box" id="pd-logo">PANTANALDEX</div>
        </div>

        <div id="pd-title-container">
            <h1 id="pd-title">Guia de Campo Digital</h1>
        </div>

        <div class="meta">ESTADO 01 / CENA CONTÍNUA / AGO 2026</div>
    </div>

    <script>
        window.onload = () => {
            gsap.registerPlugin(Flip);
            const tl = gsap.timeline();
            
            tl.from("#pd-logo", {
                y: 100,
                opacity: 0,
                duration: 1.2,
                ease: "power4.out"
            })
            .from("#pd-title", {
                opacity: 0,
                y: 20,
                duration: 0.8,
                ease: "power2.out"
            }, "-=0.6")
            .from("#pd-main-visual", {
                scale: 1.1,
                opacity: 0,
                duration: 2,
                ease: "power2.out"
            }, 0);
        };
    </script>
</body>
</html>
