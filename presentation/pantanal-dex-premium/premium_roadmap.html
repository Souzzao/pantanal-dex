<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #E8F0E6;
            color: #0A3B24;
            font-family: monospace;
            padding-top: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .kicker {
            font-size: 18px;
            letter-spacing: 4px;
            color: #1E56A0;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        h1 {
            font-family: Georgia, serif;
            font-size: 52px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 40px;
            max-width: 1000px;
            line-height: 1.1;
        }
        .chart-container {
            width: 900px;
            height: 340px;
            background: #FFFFFF;
            border: 8px solid #0A3B24;
            padding: 30px;
            margin-bottom: 40px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            width: 1100px;
            border-top: 8px solid #0A3B24;
            padding-top: 30px;
        }
        .metric-item {
            text-align: center;
            border-right: 4px solid #0A3B24;
        }
        .metric-item:last-child {
            border-right: none;
        }
        .metric-value {
            font-family: Georgia, serif;
            font-size: 56px;
            font-weight: 900;
            color: #1E56A0;
            line-height: 1;
        }
        .metric-label {
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 12px;
            font-weight: 700;
        }
        .vision-footer {
            margin-top: 30px;
            font-size: 18px;
            color: #2C3531;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <p class="kicker">07 / PLANEJAMENTO</p>
        <h1>Rumo à Maior Base de Dados do Bioma</h1>
        
        <div class="chart-container">
            <canvas id="roadmapChart"></canvas>
        </div>

        <div class="metrics-grid">
            <div class="metric-item">
                <div class="metric-value">138</div>
                <div class="metric-label">Espécies Atuais</div>
            </div>
            <div class="metric-item">
                <div class="metric-value">500</div>
                <div class="metric-label">Meta MVP</div>
            </div>
            <div class="metric-item">
                <div class="metric-value">3.000+</div>
                <div class="metric-label">Visão 2027</div>
            </div>
        </div>

        <p class="vision-footer">Arquitetura modular preparada para expansão massiva sem perda de performance.</p>
    </div>

    <script>
        const ctx = document.getElementById('roadmapChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Estado Atual', 'Meta MVP', 'Visão Final'],
                datasets: [{
                    data: [138, 500, 3000],
                    backgroundColor: ['#0A3B24', '#1E56A0', '#2C3531'],
                    borderWidth: 0,
                    borderRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: '#E8F0E6' },
                        ticks: { font: { family: 'monospace', size: 14 } }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { font: { family: 'monospace', size: 16, weight: 'bold' } }
                    }
                }
            }
        });
    </script>
</body>
</html>
