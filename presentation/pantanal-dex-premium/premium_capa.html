<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #E8F0E6;
            display: grid;
            grid-template-columns: 45% 55%;
            align-items: stretch;
            font-family: monospace;
            color: #0A3B24;
        }
        .text-section {
            padding: 80px 60px;
            border-right: 8px solid #0A3B24;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .image-section {
            background: #0A3B24;
            padding: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 8px solid #E8F0E6;
        }
        h1 {
            font-family: Georgia, serif;
            font-size: 84px;
            font-weight: 900;
            line-height: 0.9;
            margin-bottom: 30px;
        }
        .subtitle {
            font-size: 24px;
            line-height: 1.4;
            color: #2C3531;
            margin-bottom: 40px;
        }
        .tagline {
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #1E56A0;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="text-section">
            <p class="tagline">Guia de Campo Digital</p>
            <h1>Pantanal<br>Dex</h1>
            <p class="subtitle">A maior enciclopédia digital offline da fauna pantaneira. Conhecer, registrar e proteger.</p>
        </div>
        <div class="image-section">
            <img src="/home/ubuntu/upload/search_images/U1R3zy3aNbWU.jpg" alt="Pantanal Wetlands">
        </div>
    </div>
</body>
</html>
