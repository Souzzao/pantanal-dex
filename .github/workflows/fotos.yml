name: Fotos do catálogo

# Busca fotos de uso comercial livre (iNaturalist, GBIF, Wikimedia Commons), refaz o catálogo e as
# capas embutidas no app, e salva tudo na própria branch. Roda em push nas branches claude/fotos*
# ou manualmente. O ambiente de desenvolvimento não acessa esses sites, por isso roda aqui.
on:
  push:
    branches: ["claude/fotos*"]
    paths: ["scripts/catalog/fetch_photos*.py", ".github/workflows/fotos.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fotos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Busca no iNaturalist (só se ainda não houver resultado)
        run: test -f data/inat/fotos-v2.json || python3 scripts/catalog/fetch_photos.py
      - name: Busca extra (iNaturalist, GBIF e Commons) para quem tem menos de 6
        run: python3 scripts/catalog/fetch_photos_extra.py
      - name: Salvar as fotos achadas (antes de refazer o catálogo)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/inat/fotos-v2.json
          git commit -m "Fotos do catálogo: resultado da busca de fotos de uso livre" || echo "sem mudanças"
          git push
      - name: Refaz o catálogo e as capas embutidas
        run: |
          pip install --quiet pillow
          python3 scripts/catalog/build.py
          python3 scripts/catalog/embed_covers.py --workers 6
      - name: Salvar catálogo e capas na branch
        run: |
          # O catálogo (vertebrados.json) é refeito localmente: os traços dos animais (data/traits) não ficam no git.
          git add data/inat/capas-embutidas.json data/inat/capas-falhas.json shared/species-covers.ts assets/images/species/
          git commit -m "Fotos do catálogo: busca de fotos de uso livre, catálogo e capas refeitos" || echo "sem mudanças"
          git push
