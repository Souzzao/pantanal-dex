name: APK Android

# Gera os dois APKs — PantanalDex (versão final) e PantanalDex Demo (com caderno Teste e auditoria
# simulada) — a cada push na main ou na claude/v2, ou manualmente. Assinados com a chave de debug do
# prebuild: servem para instalar direto. Para a Google Play o arquivo é o AAB do EAS (docs/GOOGLE-PLAY.md). O endereço e a chave pública do Supabase vêm dos segredos do repositório
# (Settings → Secrets and variables → Actions); sem eles o app sai sem login (modo local).
on:
  push:
    branches: [main, claude/v2]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar os APKs como release pública (link do QR code)"
        type: boolean
        default: false

# Permissão mínima: o build só lê o código; só o job de release (push na main) pode publicar.
# Nenhum segredo chega a PRs de forks.
permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [production, demo]
    env:
      APP_VARIANT: ${{ matrix.variant }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Login configurado?
        run: |
          if [ -n "$EXPO_PUBLIC_SUPABASE_URL" ] && [ -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then echo "Supabase: sim (login ativo)"; else echo "::warning::Sem segredos do Supabase: APK sai sem login"; fi
      - name: NDK (baixa antes, com repetição)
        run: |
          for i in 1 2 3; do
            rm -rf "$ANDROID_HOME/ndk/27.1.12297006"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" > /dev/null && exit 0
            echo "NDK falhou ($i); de novo em 20 s"; sleep 20
          done
          exit 1
      - run: npx expo prebuild --platform android --no-install
      - name: Gradle assembleRelease
        working-directory: android
        # O Maven Central às vezes responde 429 (excesso de pedidos): tenta até 3 vezes.
        run: |
          for i in 1 2 3; do
            ./gradlew assembleRelease -x lint -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon && exit 0
            echo "Tentativa $i falhou; aguardando 30 s"; sleep 30
          done
          exit 1
      - name: Renomeia
        run: |
          NAME=$([ "$APP_VARIANT" = demo ] && echo PantanalDex-Demo || echo PantanalDex)
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: APK-${{ matrix.variant }}
          path: PantanalDex*.apk
          retention-days: 30

  release:
    # Publica os dois APKs numa "release" pública: o link de download não exige conta no GitHub
    # (usado pelo QR code). Roda em push na main ou quando o dono dispara manualmente com "publicar";
    # nunca em PR.
    needs: apk
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publicar)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: APK-*
          merge-multiple: true
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v${VERSION}-${GITHUB_RUN_NUMBER}" PantanalDex.apk PantanalDex-Demo.apk \
            --title "PantanalDex ${VERSION}" \
            --notes "PantanalDex.apk = versão final. PantanalDex-Demo.apk = demonstração (caderno Teste e auditoria simulada; instala junto da final). Gerado de ${GITHUB_SHA::7}. No Android, permita instalar apps desta fonte." \
            --latest
