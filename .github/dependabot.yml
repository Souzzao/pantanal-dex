# Avisa (por pull request) quando há atualização de segurança nas dependências.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      expo:
        patterns: ["expo*", "@expo/*", "react-native*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
